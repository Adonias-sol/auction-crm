databases:
  - name: auction-crm-db
    plan: free

services:
  - type: web
    name: auction-crm-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py bootstrap_admin"
    startCommand: "gunicorn auction_crm.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auction-crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "auction-crm-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://auction-crm-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false